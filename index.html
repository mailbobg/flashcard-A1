:root{
  color-scheme:light;
  --color-background-body:light-dark(#F8F4ED,#111112);
  --color-background-card:light-dark(#FFFFFF,#1F1F22);
  --color-background-muted:light-dark(#0536590C,#1111127F);
  --color-background-inverted:light-dark(#0A1317,#FFFFFF);
  --color-background-blue:light-dark(#0171E333,#0171E333);
  --color-text-primary:light-dark(#15110C,#DFE2E5);
  --color-text-secondary:light-dark(#4E606F,#AAAFB5);
  --color-text-disabled:light-dark(#A4B0BC,#6F747C);
  --color-text-red:light-dark(#7B0210,#FFB2B8);
  --color-text-yellow:light-dark(#753F07,#FBCE03);
  --color-text-green:light-dark(#09441F,#A5F690);
  --color-text-blue:light-dark(#042F97,#AFD7FF);
  --color-text-purple:light-dark(#3E0697,#B3B0FE);
  --color-text-cyan:light-dark(#014975,#A1EEF9);
  --color-background-red:light-dark(#E3193B26,#E3193B33);
  --color-background-yellow:light-dark(#E2A40033,#E2A40033);
  --color-background-green:light-dark(#24BB5E26,#24BB5E33);
  --color-background-purple:light-dark(#7952FF26,#7952FF33);
  --color-background-cyan:light-dark(#03A7D726,#03A7D733);
  --color-neutral:light-dark(rgba(5,54,89,.1),rgba(223,226,229,.2));
  --color-background-orange:light-dark(#F2790233,#F2790233);
  --color-text-orange:light-dark(#6B2203,#FDB876);
  --color-accent:light-dark(#15110C,#DFE2E5);
  --color-on-accent:light-dark(#FFFFFF,#15110C);
  --color-accent-muted:light-dark(rgba(21,17,12,.08),rgba(223,226,229,.14));
  --color-brand:light-dark(#225BFF,#3D87FF);
  --color-icon-red:light-dark(#D31130,#E3193B);
  --color-border:light-dark(#05365919,#F2F4F619);
  --color-border-emphasized:light-dark(#CCD3DB,#494D53);
  --color-track:light-dark(#CCD3DB,#5A5E66);
  --color-success:light-dark(#0D8626,#26A756);
  --color-success-muted:light-dark(#0B991F33,#0B991F3F);
  --color-warning:light-dark(#E9AF08,#F2C00B);
  --color-warning-muted:light-dark(#E2A40033,#E2A4003F);
  --color-error:light-dark(#E3193B,#F5394F);
  --color-error-muted:light-dark(#E3193B33,#F5394F3F);
  --shadow-low:0px 1px 1px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2)),0px 2px 8px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2));
  --shadow-med:0px 1px 2px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2)),0px 2px 12px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2));
  --shadow-high:0px 2px 2px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2)),0px 8px 24px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.3));
  --radius-inner:8px; --radius-element:12px; --radius-container:16px; --radius-page:32px; --radius-full:9999px;
  --spacing-1:4px; --spacing-2:8px; --spacing-3:12px; --spacing-4:16px; --spacing-5:20px; --spacing-6:24px; --spacing-8:32px;
  --font-family-body:Figtree,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-size-xs:.625rem; --font-size-sm:.75rem; --font-size-base:.875rem; --font-size-lg:1.0625rem;
  --font-size-xl:1.25rem; --font-size-2xl:1.5rem; --font-size-3xl:1.8125rem; --font-size-5xl:2.625rem;
  --font-weight-medium:500; --font-weight-semibold:600; --font-weight-bold:700;
  --ease-standard:cubic-bezier(.24,1,.4,1);
  --duration-fast:175ms; --duration-medium:410ms;
  --border-width:1px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root.dark{color-scheme:dark}
/* light-dark() 不支持时的浅色兜底 */
@supports not (color:light-dark(#000,#fff)){
  :root{
    --color-background-body:#F8F4ED; --color-background-card:#FFFFFF; --color-background-muted:#0536590C;
    --color-background-inverted:#0A1317; --color-background-blue:#0171E333;
    --color-text-primary:#15110C; --color-text-secondary:#4E606F; --color-text-disabled:#A4B0BC;
    --color-text-red:#7B0210; --color-text-yellow:#753F07; --color-text-green:#09441F; --color-text-blue:#042F97;
    --color-accent:#15110C; --color-on-accent:#FFFFFF; --color-accent-muted:rgba(21,17,12,.08);
    --color-brand:#225BFF; --color-icon-red:#D31130; --color-border:#05365919; --color-border-emphasized:#CCD3DB;
    --color-track:#CCD3DB; --color-success:#0D8626; --color-success-muted:#0B991F33; --color-warning:#E9AF08;
    --color-warning-muted:#E2A40033; --color-error:#E3193B; --color-error-muted:#E3193B33;
    --shadow-low:0 1px 1px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.1);
    --shadow-med:0 1px 2px rgba(0,0,0,.1),0 2px 12px rgba(0,0,0,.1);
    --shadow-high:0 2px 2px rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.1);
  }
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ogimg{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
html,body{height:100%}
body{
  background:var(--color-background-body); color:var(--color-text-primary); overflow:hidden;
  font-family:var(--font-family-body); font-size:var(--font-size-base); line-height:1.4286;
  -webkit-font-smoothing:antialiased;
}
/* Astryx hero 的极光底：暖桃 + 玫瑰，压在象牙纸下方 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70% 42% at 8% 100%, light-dark(rgba(242,121,2,.16),rgba(61,135,255,.10)), transparent 70%),
    radial-gradient(64% 40% at 92% 100%, light-dark(rgba(230,56,179,.14),rgba(121,82,255,.12)), transparent 72%),
    radial-gradient(90% 30% at 50% 100%, light-dark(rgba(226,164,0,.10),transparent), transparent 70%);
}

#app{height:100dvh;height:100vh;display:flex;flex-direction:column}
.hd{
  padding:calc(var(--safe-t) + 16px) var(--spacing-5) var(--spacing-3);
  display:flex;align-items:center;gap:10px;flex:0 0 auto;
}
.mark{flex:0 0 auto;width:32px;height:32px;display:block}
.mark svg{width:100%;height:100%;display:block}
.hd h1{font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);letter-spacing:-.01em}
.hd .sub{font-size:var(--font-size-xs);color:var(--color-text-secondary);font-weight:400;margin-top:1px}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 var(--spacing-5) var(--spacing-6)}

.tabbar{
  flex:0 0 auto;display:flex;gap:2px;padding:6px var(--spacing-3) calc(var(--safe-b) + 6px);
  background:var(--color-background-card);border-top:var(--border-width) solid var(--color-border);
}
.tabbar button{
  flex:1;background:none;border:0;color:var(--color-text-secondary);padding:7px 0 5px;font-size:var(--font-size-xs);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-weight:var(--font-weight-medium);
  border-radius:var(--radius-element);transition:color var(--duration-fast) var(--ease-standard);
}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--color-text-primary);background:var(--color-accent-muted)}
/* Koboyo 手绘图标：填充风格，非线性。class 由 build.py 注入到 svg 根 */
.ki{fill:currentColor;stroke:none;display:inline-block}
.tabbar button .ki{width:20px;height:20px}
.iconbtn .ki{width:18px;height:18px}
.btn .ki{width:15px;height:15px;vertical-align:-2px}
.chap .ki{width:22px;height:22px}

/* ---------- 基础控件 ---------- */
.btn{
  background:var(--color-background-muted);border:var(--border-width) solid transparent;color:var(--color-text-primary);
  border-radius:var(--radius-full);padding:9px 15px;font-size:var(--font-size-base);font-family:inherit;
  font-weight:var(--font-weight-medium);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform var(--duration-fast) var(--ease-standard);
}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--color-accent);color:var(--color-on-accent);font-weight:var(--font-weight-semibold)}
.btn.line{background:transparent;border-color:var(--color-border-emphasized)}
.btn.blk{width:100%;padding:14px}
.chipbar{display:flex;gap:var(--spacing-2)}
.muted{color:var(--color-text-secondary)}
.tiny{font-size:var(--font-size-sm)}
.sec-t{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);letter-spacing:.09em;
  margin:var(--spacing-6) 0 var(--spacing-3);text-transform:uppercase;font-weight:var(--font-weight-semibold);
}
.card{
  background:var(--color-background-card);border:var(--border-width) solid var(--color-border);
  border-radius:var(--radius-container);box-shadow:var(--shadow-low);
}

/* ---------- 首页 ---------- */
.panel{padding:var(--spacing-5)}
.dash{display:flex;align-items:center;gap:var(--spacing-5)}
.ring{flex:0 0 auto;position:relative;width:86px;height:86px}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--color-track)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:var(--font-size-xl);line-height:1;font-weight:var(--font-weight-semibold);letter-spacing:-.02em}
.ring .num span{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:3px}
.stat{display:flex;flex-direction:column;gap:9px;flex:1}
.stat div{display:flex;align-items:baseline;gap:8px}
.stat div b{font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);width:34px;letter-spacing:-.02em}
.stat div span{font-size:var(--font-size-sm);color:var(--color-text-secondary)}
.stat div i{width:6px;height:6px;border-radius:var(--radius-full);flex:0 0 auto}

.chap{
  display:flex;align-items:center;gap:var(--spacing-3);padding:var(--spacing-3) var(--spacing-4);
  margin-bottom:var(--spacing-2);width:100%;text-align:left;color:inherit;font-family:inherit;
  font-size:var(--font-size-base);transition:transform var(--duration-fast) var(--ease-standard);
}
.chap:active{transform:scale(.985)}
/* 章节序号 = 元素砖 */
.chap .no{
  flex:0 0 auto;width:34px;height:34px;border-radius:var(--radius-inner);background:var(--color-accent);
  color:var(--color-on-accent);display:flex;align-items:center;justify-content:center;
  font-size:var(--font-size-base);font-weight:var(--font-weight-semibold)
}
.chap .bd{flex:1;min-width:0}
.chap .bd .t{font-weight:var(--font-weight-semibold);font-size:var(--font-size-base)}
.chap .bd .e{font-size:var(--font-size-xs);color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bar{height:4px;border-radius:var(--radius-full);background:var(--color-track);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--color-accent);border-radius:var(--radius-full)}
.chap .n{flex:0 0 auto;font-size:var(--font-size-sm);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}

/* ---------- 学习卡 ---------- */
#study{position:fixed;inset:0;background:var(--color-background-body);z-index:50;display:none;flex-direction:column}
#study.on{display:flex}
.stbar{display:flex;align-items:center;gap:var(--spacing-3);padding:calc(var(--safe-t) + 14px) var(--spacing-5) var(--spacing-2)}
.stbar .pg{font-size:var(--font-size-sm);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.stbar .prog{flex:1;height:4px;background:var(--color-track);border-radius:var(--radius-full);overflow:hidden}
.stbar .prog i{display:block;height:100%;background:var(--color-accent);border-radius:var(--radius-full);transition:width var(--duration-medium) var(--ease-standard)}
.iconbtn{background:none;border:0;color:var(--color-text-secondary);font-size:18px;padding:4px 6px;font-family:inherit;line-height:1}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.star-on svg{fill:var(--color-warning);stroke:var(--color-warning)}
.cardwrap{flex:1 1 auto;margin:var(--spacing-2) var(--spacing-4) 0;perspective:1600px;min-height:0}
.card3d{position:relative;width:100%;height:100%;transition:transform var(--duration-medium) var(--ease-standard);transform-style:preserve-3d}
.card3d.flip{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--color-background-card);border:var(--border-width) solid var(--color-border);
  border-radius:var(--radius-page);box-shadow:var(--shadow-high);
  padding:var(--spacing-6) var(--spacing-5);overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
}
.face.back{transform:rotateY(180deg)}
.tag{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);letter-spacing:.04em;flex:0 0 auto;
  display:flex;align-items:center;gap:7px;
}
.tag .sn{
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:var(--radius-inner);background:var(--color-accent-muted);color:var(--color-text-primary);
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-xs);
}
.mid{margin:auto 0;flex:0 0 auto}
.word{
  font-size:var(--font-size-5xl);font-weight:var(--font-weight-semibold);letter-spacing:-.03em;
  margin-top:var(--spacing-5);word-break:break-word;line-height:1.08;
}
.word.long{font-size:var(--font-size-2xl);letter-spacing:-.02em}
.ipa{font-size:var(--font-size-lg);color:var(--color-text-secondary);margin-top:9px;letter-spacing:.01em}
.spk{display:flex;gap:var(--spacing-2);margin-top:var(--spacing-5);flex-wrap:wrap}
.spk .btn{padding:8px 13px;font-size:var(--font-size-sm)}
.syl-h{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);margin:var(--spacing-6) 0 var(--spacing-3);
  display:flex;align-items:center;gap:var(--spacing-2);letter-spacing:.06em;font-weight:var(--font-weight-medium);
}
.syl-h::after{content:"";flex:1;height:var(--border-width);background:var(--color-border-emphasized);opacity:.6}

/* 卡背 */
.zh{font-size:var(--font-size-3xl);font-weight:var(--font-weight-semibold);margin-top:var(--spacing-3);line-height:1.3;letter-spacing:-.01em}
.blk2{
  background:var(--color-warning-muted);border-radius:var(--radius-container);
  padding:var(--spacing-4);margin-top:var(--spacing-5);
}
.blk2 .lb{
  font-size:var(--font-size-xs);color:var(--color-text-yellow);letter-spacing:.09em;margin-bottom:6px;
  text-transform:uppercase;font-weight:var(--font-weight-semibold);
}
.blk2 p{font-size:var(--font-size-base);line-height:1.75;color:var(--color-text-primary)}
.ex{background:var(--color-background-muted);border-radius:var(--radius-container);padding:var(--spacing-4);margin-top:var(--spacing-3)}
.ex .en{font-size:var(--font-size-lg);line-height:1.5;font-weight:var(--font-weight-medium)}
.ex .cn{font-size:var(--font-size-base);color:var(--color-text-secondary);margin-top:7px}
.ex .rowbtn{margin-top:var(--spacing-3);display:flex;gap:var(--spacing-2);flex-wrap:wrap}

/* ---------- 德语：性别三色 ---------- */
/* 三个冠词各给一个颜色，全应用一致——名词永远和它的颜色一起出现，
   靠颜色形成条件反射，比背「der/die/das」这三个字管用 */
.art{
  font-size:.62em;font-weight:var(--font-weight-bold);letter-spacing:.02em;
  vertical-align:.14em;padding:2px 7px;border-radius:var(--radius-full);
}
.g-der{background:var(--color-background-blue);color:var(--color-text-blue)}
.g-die{background:var(--color-error-muted);color:var(--color-text-red)}
.g-das{background:var(--color-success-muted);color:var(--color-text-green)}
/* 复数另起一行，且宽度只包住文字（display:table 正好两者兼得）。
   底色统一用 die 的颜色——所有复数都是 die，这本身就是要背的规则 */
.plural{
  display:table;margin-top:12px;font-size:var(--font-size-lg);
  font-weight:var(--font-weight-medium);letter-spacing:-.01em;
  padding:3px 11px;border-radius:var(--radius-full);
}
.word .wd{word-break:break-word}
.row .w .art{font-size:11px;padding:1px 6px;margin-right:4px}

.thema{align-items:flex-start;padding:13px var(--spacing-4)}
.thema .bar{margin-top:9px}
.thema .n{font-variant-numeric:tabular-nums;padding-top:2px}

/* ---------- 发音关 ---------- */
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:var(--spacing-2)}
.ab{
  background:var(--color-background-card);border:var(--border-width) solid var(--color-border-emphasized);
  border-radius:var(--radius-element);padding:9px 4px 7px;text-align:center;
  font-family:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow-low);
  transition:transform var(--duration-fast) var(--ease-standard),background var(--duration-fast) var(--ease-standard);
}
.ab:active{background:var(--color-accent-muted);border-color:var(--color-accent);transform:translateY(-2px)}
.ab b{display:block;font-size:var(--font-size-2xl);font-weight:var(--font-weight-semibold);letter-spacing:-.02em;line-height:1.05}
.ab i{display:block;font-style:normal;font-size:var(--font-size-xs);color:var(--color-brand);margin-top:3px}
.ab s{display:block;text-decoration:none;font-size:10px;color:var(--color-text-disabled);margin-top:2px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltip{
  display:flex;gap:9px;align-items:baseline;margin-top:var(--spacing-2);
  padding:9px var(--spacing-4);background:var(--color-background-muted);
  border-radius:var(--radius-container);font-size:var(--font-size-sm);
  color:var(--color-text-secondary);line-height:1.6;
}
.ltip b{flex:0 0 auto;font-size:var(--font-size-lg);color:var(--color-text-primary);width:20px}

.rule{padding:var(--spacing-4) var(--spacing-5);margin-bottom:var(--spacing-2)}
.rh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rr{font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);letter-spacing:-.01em}
.ripa{font-size:var(--font-size-base);color:var(--color-brand);letter-spacing:.01em}
.rzh{font-size:var(--font-size-base);color:var(--color-text-primary);line-height:1.7;margin-top:7px}
/* 英语干扰提示：整个第 0 关的编写主线，给它独立的黄底 */
.ren{
  margin-top:9px;padding:9px 12px;border-radius:var(--radius-container);
  background:var(--color-warning-muted);color:var(--color-text-yellow);
  font-size:var(--font-size-sm);line-height:1.65;
}
.rex{display:flex;flex-wrap:wrap;gap:var(--spacing-2);margin-top:11px}
.exw{
  background:var(--color-background-muted);border:0;border-radius:var(--radius-inner);
  padding:7px 12px;font-size:var(--font-size-base);font-weight:var(--font-weight-medium);
  font-family:inherit;color:inherit;
}
.exw:active{background:var(--color-accent-muted)}
.exw.big{flex:1;font-size:var(--font-size-2xl);font-weight:var(--font-weight-semibold);padding:14px 4px;letter-spacing:-.01em}
.pair{padding:var(--spacing-4);margin-bottom:var(--spacing-2)}
.pw{display:flex;align-items:center;gap:var(--spacing-2)}
.vs{flex:0 0 auto;font-size:var(--font-size-xs);color:var(--color-text-disabled);letter-spacing:.06em}
.pair .rzh{margin-top:10px;font-size:var(--font-size-sm);color:var(--color-text-secondary)}
/* 评分 */
.actwrap{flex:0 0 auto;padding:var(--spacing-3) var(--spacing-4) calc(var(--safe-b) + var(--spacing-3))}
.acts{display:flex;gap:var(--spacing-2)}
.acts button{
  flex:1;border:0;border-radius:var(--radius-full);padding:14px 0;font-size:var(--font-size-lg);
  font-family:inherit;font-weight:var(--font-weight-semibold);
  transition:transform var(--duration-fast) var(--ease-standard);
}
.acts button:active{transform:scale(.96)}
.acts .b0{background:var(--color-error-muted);color:var(--color-text-red)}
.acts .b1{background:var(--color-warning-muted);color:var(--color-text-yellow)}
.acts .b2{background:var(--color-success-muted);color:var(--color-text-green)}
.actcap{display:flex;gap:var(--spacing-2);margin-top:7px}
.actcap span{flex:1;text-align:center;font-size:var(--font-size-xs);color:var(--color-text-disabled)}

/* ---------- 词表 ---------- */
.search{
  width:100%;background:var(--color-background-card);border:var(--border-width) solid var(--color-border-emphasized);
  border-radius:var(--radius-full);padding:11px var(--spacing-4);color:var(--color-text-primary);
  font-size:var(--font-size-base);font-family:inherit;
}
.search::placeholder{color:var(--color-text-disabled)}
.search:focus{outline:none;border-color:var(--color-accent)}
.rowgrp{overflow:hidden;margin-bottom:var(--spacing-2)}
.row{
  display:flex;align-items:center;gap:var(--spacing-3);padding:12px var(--spacing-4);width:100%;
  text-align:left;color:inherit;font-family:inherit;
  border-bottom:var(--border-width) solid var(--color-border);
}
.row:last-child{border-bottom:0}
.row:active{background:var(--color-background-muted)}
.dot{flex:0 0 auto;width:7px;height:7px;border-radius:var(--radius-full);background:var(--color-track)}
.row .bd{flex:1;min-width:0}
.row .w{font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);letter-spacing:-.01em}
.row .p{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-left:5px}
.row .z{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-top:2px}
.row .z.hide{filter:blur(5px);opacity:.7}
.grp{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);margin:var(--spacing-5) 0 var(--spacing-2);
  font-weight:var(--font-weight-semibold);letter-spacing:.06em;
}

/* ---------- 课前预习 ---------- */
.lhero{padding:var(--spacing-5);margin-top:var(--spacing-3)}
.ltag{
  display:inline-block;font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);
  background:var(--color-accent);color:var(--color-on-accent);
  border-radius:var(--radius-full);padding:4px 11px;letter-spacing:.03em;
}
.ltitle{font-size:var(--font-size-2xl);font-weight:var(--font-weight-semibold);letter-spacing:-.02em;margin-top:11px;line-height:1.3}
.lsub{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:6px}
.lintro{
  margin-top:var(--spacing-4);padding-top:var(--spacing-3);
  border-top:var(--border-width) solid var(--color-border);
  font-size:var(--font-size-sm);color:var(--color-text-secondary);line-height:1.8;
}
.lcard .no{background:var(--color-brand)}
/* ---------- 设置 ---------- */
.setgrp{overflow:hidden;margin-bottom:var(--spacing-2)}
.set{
  display:flex;align-items:center;gap:var(--spacing-3);padding:14px var(--spacing-4);
  border-bottom:var(--border-width) solid var(--color-border);
}
.set:last-child{border-bottom:0}
.set .lb{flex:1;font-size:var(--font-size-base);font-weight:var(--font-weight-medium)}
.set .lb small{display:block;color:var(--color-text-secondary);font-size:var(--font-size-xs);margin-top:2px;font-weight:400}
select{
  background:var(--color-background-muted);color:var(--color-text-primary);border:0;border-radius:var(--radius-full);
  padding:8px 11px;font-size:var(--font-size-sm);max-width:54%;font-family:inherit;font-weight:var(--font-weight-medium);
}
input[type=range]{width:118px;accent-color:var(--color-accent);font-family:inherit}
.sw{width:46px;height:27px;border-radius:var(--radius-full);background:var(--color-track);position:relative;flex:0 0 auto;border:0;transition:background var(--duration-fast) var(--ease-standard)}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:var(--radius-full);background:#fff;transition:left var(--duration-fast) var(--ease-standard);box-shadow:var(--shadow-low)}
.sw.on{background:var(--color-accent)}
.sw.on i{left:22px}
.lvrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.lvrow em{font-style:normal;font-size:var(--font-size-xs);color:var(--color-text-secondary);width:34px}
.lvrow u{text-decoration:none;font-size:var(--font-size-xs);color:var(--color-text-secondary);width:24px;text-align:right;font-variant-numeric:tabular-nums}

.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 86px);transform:translateX(-50%) translateY(6px);
  background:var(--color-background-inverted);color:var(--color-background-body);padding:10px 18px;
  border-radius:var(--radius-full);font-size:var(--font-size-base);font-weight:var(--font-weight-medium);z-index:99;
  opacity:0;pointer-events:none;transition:opacity var(--duration-fast) var(--ease-standard),transform var(--duration-fast) var(--ease-standard);
  box-shadow:var(--shadow-high);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--color-text-disabled);font-size:var(--font-size-base);padding:48px 0}
.credit{text-align:center;margin:var(--spacing-5) 0 var(--spacing-2);font-size:var(--font-size-xs);color:var(--color-text-disabled)}

/* ---------- 专项练习 ---------- */
#drill{position:fixed;inset:0;background:var(--color-background-body);z-index:55;display:none;flex-direction:column}
#drill.on{display:flex}
.drt{flex:1;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);letter-spacing:-.01em;min-width:0}
#drBody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--spacing-2) var(--spacing-5) calc(var(--safe-b) + var(--spacing-6))}
.dseg{display:flex;gap:var(--spacing-2);margin:var(--spacing-3) 0 0}
.dseg button{flex:1;background:var(--color-background-muted);border:0;border-radius:var(--radius-full);padding:9px 0;
  font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold);font-family:inherit;color:var(--color-text-secondary)}
.dseg button.on{background:var(--color-accent);color:var(--color-on-accent)}
/* 出题区 */
.qcard{padding:var(--spacing-5);margin-top:var(--spacing-3);text-align:center}
.qbig{font-size:var(--font-size-5xl);font-weight:var(--font-weight-semibold);letter-spacing:-.02em;line-height:1.1;word-break:break-word}
.qsub{font-size:var(--font-size-base);color:var(--color-text-secondary);margin-top:8px}
.qbtn{display:flex;gap:var(--spacing-2);margin-top:var(--spacing-4);flex-wrap:wrap;justify-content:center}
.qbtn .btn{flex:1;min-width:110px}
.qinp{width:100%;margin-top:var(--spacing-4);background:var(--color-background-card);border:2px solid var(--color-border-emphasized);
  border-radius:var(--radius-element);padding:13px var(--spacing-4);font-size:var(--font-size-2xl);text-align:center;
  font-family:inherit;color:var(--color-text-primary);font-variant-numeric:tabular-nums}
.qinp:focus{outline:none;border-color:var(--color-accent)}
/* 判分反馈 */
.qfb{margin-top:var(--spacing-4);padding:var(--spacing-4);border-radius:var(--radius-container);font-size:var(--font-size-lg);line-height:1.6}
.qfb.ok{background:var(--color-success-muted);color:var(--color-text-green)}
.qfb.no{background:var(--color-error-muted);color:var(--color-text-red)}
.qfb b{font-weight:var(--font-weight-bold)}
/* 冠词三选 */
.art3{display:flex;gap:var(--spacing-2);margin-top:var(--spacing-5)}
.art3 button{flex:1;border:0;border-radius:var(--radius-full);padding:15px 0;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);font-family:inherit;transition:transform var(--duration-fast) var(--ease-standard)}
.art3 button:active{transform:scale(.96)}
.art3 .b-der{background:var(--color-background-blue);color:var(--color-text-blue)}
.art3 .b-die{background:var(--color-error-muted);color:var(--color-text-red)}
.art3 .b-das{background:var(--color-success-muted);color:var(--color-text-green)}
.art3 button.wrong{outline:3px solid var(--color-error)}
.rulechip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:9px 13px;border-radius:var(--radius-element);
  background:var(--color-warning-muted);font-size:var(--font-size-sm);color:var(--color-text-yellow);line-height:1.5}
.rulechip b{font-weight:var(--font-weight-bold)}
.rulechip .art{font-size:11px;padding:1px 7px}
/* 句子排序 */
.satz-ern{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:var(--spacing-3);padding:13px var(--spacing-4);
  background:var(--color-background-blue);border-radius:var(--radius-element);font-size:var(--font-size-sm);color:var(--color-text-blue);line-height:1.6}
.pool{display:flex;flex-wrap:wrap;gap:var(--spacing-2);margin-top:var(--spacing-4);min-height:44px}
.pool .block,.sel .block{background:var(--color-background-muted);border:var(--border-width) solid var(--color-border-emphasized);
  border-radius:var(--radius-full);padding:9px 15px;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);font-family:inherit;color:inherit;cursor:pointer}
.pool .block:active{transform:scale(.96);background:var(--color-accent-muted)}
.pool .block.dim{opacity:.25;pointer-events:none}
.sel{display:flex;flex-wrap:wrap;gap:var(--spacing-2);margin-top:var(--spacing-2);min-height:44px;border-bottom:2px dashed var(--color-border-emphasized);padding-bottom:var(--spacing-2)}
.sel .block{background:var(--color-accent);color:var(--color-on-accent);border-color:transparent}
.satz-act{display:flex;gap:var(--spacing-2);margin-top:var(--spacing-4)}
.kbox{display:flex;flex-wrap:wrap;align-items:stretch;margin-top:9px}
.kbox .pre{display:flex;align-items:center;padding:8px 13px;border-radius:var(--radius-inner) 0 0 var(--radius-inner);
  border:2px solid var(--color-brand);border-right-width:1px;background:var(--color-background-card);font-weight:var(--font-weight-semibold)}
.kbox .mid{display:flex;align-items:center;padding:8px 13px;border-top:2px solid var(--color-brand);border-bottom:2px solid var(--color-brand);color:var(--color-text-secondary);font-size:var(--font-size-sm)}
.kbox .right{display:flex;align-items:center;padding:8px 13px;border:2px solid var(--color-brand);border-left-width:1px;border-radius:0 var(--radius-inner) var(--radius-inner) 0;background:var(--color-background-card);font-weight:var(--font-weight-semibold)}
.kcap{margin-top:6px;font-size:var(--font-size-xs);color:var(--color-brand);letter-spacing:.04em}
/* 考试用语列表 */
.drlist .row .w{font-size:var(--font-size-lg)}
.drlist .row .z{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-top:2px}
.drstat{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin:var(--spacing-3) 2px 0;line-height:1.7}

/* ---------- 例句拆解（Zergliederung） ---------- */
.tr{margin-top:var(--spacing-4)}
.tr-hd{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:var(--font-size-base);font-weight:var(--font-weight-semibold);color:var(--color-text-purple);
}
.tr .pat{
  display:inline-block;font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);
  background:var(--color-accent-muted);border-radius:var(--radius-full);padding:4px 11px;letter-spacing:.03em;
  color:var(--color-text-primary);
}
.tr-step{
  display:flex;align-items:center;gap:8px;margin:15px 0 9px;
  font-size:var(--font-size-xs);color:var(--color-text-secondary);font-weight:var(--font-weight-medium);
}
.tr-step::after{content:"";flex:1;height:var(--border-width);background:var(--color-border-emphasized);opacity:.55}
.flow{margin-top:10px;border-left:2px solid var(--color-brand);padding-left:12px}
.fl{display:flex;align-items:baseline;gap:10px;padding:5px 0;flex-wrap:wrap}
.fl + .fl{border-top:var(--border-width) dashed var(--color-border-emphasized)}
.fl .fe{font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);flex:1;min-width:0}
.fl .fz{font-size:var(--font-size-base);flex:0 0 auto;margin-left:auto;text-align:right;font-weight:var(--font-weight-medium)}
.tr .s{color:var(--color-text-green)}
.tr .v{color:var(--color-text-blue)}
.tr .o{color:var(--color-text-red)}
.tr .a{color:var(--color-text-purple)}
.tr .d{color:var(--color-text-yellow)}
.tr .c{color:var(--color-text-cyan)}
.tr .x{color:var(--color-text-primary)}
/* 句框：框左 + 框中 + 框右，用上下边框连成 U 形 */
.klamp{display:flex;flex-wrap:wrap;align-items:stretch;margin-top:9px}
.klamp .pre{display:flex;align-items:center;padding:7px 11px;border-radius:var(--radius-inner) 0 0 var(--radius-inner);
  border:2px solid var(--color-brand);border-right-width:1px;background:var(--color-background-card);font-weight:var(--font-weight-semibold)}
.klamp .mid{display:flex;align-items:center;padding:7px 11px;border-top:2px solid var(--color-brand);border-bottom:2px solid var(--color-brand);
  color:var(--color-text-secondary);font-size:var(--font-size-sm)}
.klamp .right{display:flex;align-items:center;padding:7px 11px;border:2px solid var(--color-brand);border-left-width:1px;border-radius:0 var(--radius-inner) var(--radius-inner) 0;
  background:var(--color-background-card);font-weight:var(--font-weight-semibold)}
.klamp .kcap{flex-basis:100%;margin-top:6px;font-size:var(--font-size-xs);color:var(--color-brand);letter-spacing:.04em}
/* 格标注 */
.kasus{display:flex;flex-wrap:wrap;gap:var(--spacing-2);margin-top:9px}
.kasus span{display:inline-flex;align-items:center;gap:6px;background:var(--color-background-muted);
  border-radius:var(--radius-full);padding:5px 11px;font-size:var(--font-size-sm)}
.kasus em{font-style:normal;font-weight:var(--font-weight-semibold)}
.kasus i{font-style:normal;color:var(--color-text-secondary);font-size:var(--font-size-xs)}
/* 完整译文 */
.tr-final{
  margin-top:11px;padding:11px 13px;background:var(--color-background-card);
  border:var(--border-width) solid var(--color-border-emphasized);border-radius:var(--radius-element);
  font-size:var(--font-size-lg);line-height:1.6;font-weight:var(--font-weight-medium);
}
.tr-final .fw.x{text-decoration:none}
.tr-tip{
  margin-top:10px;padding:10px 13px;border-radius:var(--radius-element);
  background:var(--color-warning-muted);color:var(--color-text-yellow);font-size:var(--font-size-sm);line-height:1.7;
}
.tr-tip::before{content:"💡 "}
</style>

/* ===================== 数据索引 ===================== */
/* 官方词表用缩进表示派生关系，构建时已把派生词并进主词条的 derived。
   这里把两级摊平成一个可检索的列表，但保留 base 指向主词条。 */
const ALL = [];
DATA.woerter.forEach(w => {
  ALL.push(w);
  (w.derived || []).forEach(d => { d.base = w.w; ALL.push(d); });
});
const BY_W = Object.fromEntries(ALL.map(w => [w.w, w]));
const NOUNS = ALL.filter(w => w.pos === 'noun');

/* der/die/das 三色 —— 全应用统一，见产品文档 3.1 */
const ART_CLS = { der: 'g-der', die: 'g-die', das: 'g-das' };
const artHTML = w => w.art
  ? `<span class="art ${ART_CLS[w.art]}">${w.art}</span> `
  : '';
/* 词形（名词带冠词与复数） */
function wordHTML(w, withPl) {
  const head = `${artHTML(w)}<span class="wd">${esc(w.w)}</span>`;
  if (!withPl || !w.pl || w.pl === w.w) return head;
  return head + `<div class="plural ${ART_CLS.die}">die ${esc(w.pl)}</div>`;
}

/* ===================== 存储 ===================== */
const KEY = 'igcse-flashcard-v1';
const DEF = {
  prog: {},                       // word -> {box, due, seen, wrong, star}
  les: {},                        // 课时 id -> {goals:[], check:[]} 勾选状态
  set: { rate: .95, voice: '', autoSpeak: true, sylMode: 'respell', maskZh: false, theme: 'light', tts: 'sys' }
};
let S = load();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    return { prog: raw.prog || {}, les: raw.les || {}, set: Object.assign({}, DEF.set, raw.set || {}) };
  } catch (e) { return JSON.parse(JSON.stringify(DEF)); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function lrec(id) { return S.les[id] || (S.les[id] = { goals: [], check: [] }); }
function rec(w) { return S.prog[w] || (S.prog[w] = { box: 0, due: 0, seen: 0, wrong: 0, star: 0 }); }
function applyTheme() {
  const dark = S.set.theme === 'dark';
  document.documentElement.classList.toggle('dark', dark);   // :root.dark → color-scheme:dark → light-dark() 全量切换
  document.querySelector('meta[name=theme-color]').content = dark ? '#111112' : '#F8F4ED';
}

const IC = {
  spk: K.vol,
  slow: K.slow,
  play: '<svg viewBox="0 0 24 24"><path d="M7.5 4.8l11 7.2-11 7.2z"/></svg>',
  tick: '<svg viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19 7.6"/></svg>'
};
applyTheme();
/* 底栏四个 tab 换成 Koboyo 手绘图标 */
const TAB_IC = { home: 'book', laut: 'vol', list: 'list', me: 'set' };
document.querySelectorAll('#tabs button').forEach(b => {
  b.insertAdjacentHTML('afterbegin', K[TAB_IC[b.dataset.t]]);
  const old = b.querySelector('svg:not(.ki)');
  if (old) old.remove();
});

/* 间隔重复：盒子 0..5 对应的下次复习间隔 */
const STEP = [0, 10 * 60e3, 24 * 3600e3, 3 * 24 * 3600e3, 7 * 24 * 3600e3, 21 * 24 * 3600e3];
function grade(word, g) {
  const r = rec(word); r.seen++;
  if (g === 0) { r.box = 0; r.wrong++; }
  else if (g === 1) { r.box = Math.min(Math.max(r.box, 1), 3); }   // 模糊：至少 10 分钟后再来
  else { r.box = Math.min(5, r.box + 1); }
  r.due = Date.now() + STEP[r.box];
  save();
}
const isDue = w => { const r = S.prog[w.w]; return r && r.seen > 0 && r.due <= Date.now(); };
const isNew = w => !S.prog[w.w] || !S.prog[w.w].seen;
const isMastered = w => (S.prog[w.w]?.box || 0) >= 4;

/* ===================== 朗读 ===================== */
let VOICES = [], booted = false;
/* 英音优先、系统默认音优先，玩具音色排最后 */
/* 德语语音优先 de-DE，系统默认音优先，玩具音色排最后 */
/* 真正的玩具音色。注意别把 Eddy / Flo / Grandma 这类 macOS「新声音」当玩具——
   它们在德语里是正常语音，过滤掉会导致德语只剩一个声音可选 */
const FUN = /bahh|junior|superstar|whisper|zarvox|trinoids|jester|organ|bells|boing|bubbles|cellos/i;
const rank = v => (FUN.test(v.name) ? 4 : 0) + (/de[-_]DE/i.test(v.lang) ? 0 : 1) + (v.default ? -1 : 0);
function loadVoices() {
  VOICES = (speechSynthesis.getVoices() || []).filter(v => /^de/i.test(v.lang))
    .sort((a, b) => (rank(a) - rank(b)) || a.name.localeCompare(b.name));
  if (booted && curView === 'me') render();   // 语音列表异步到达时刷新设置页
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function pickVoice() {
  if (!VOICES.length) return null;
  if (S.set.voice) { const v = VOICES.find(v => v.voiceURI === S.set.voice); if (v) return v; }
  return VOICES.find(v => /de[-_]DE/i.test(v.lang)) || VOICES[0];
}
/* 慢速用绝对值而不是「正常速 − 偏移」：部分系统语音对 rate 不敏感，差距必须拉够大 */
const SLOW = .4;

/* iOS / Safari 要求首次朗读发生在用户手势内，先用一个静音串把引擎唤醒 */
let ttsPrimed = false, ttsWarned = false;
function primeTTS() {
  if (ttsPrimed || !window.speechSynthesis) return;
  ttsPrimed = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener('pointerdown', primeTTS, { once: true, capture: true });
document.addEventListener('touchstart', primeTTS, { once: true, capture: true, passive: true });

function stopSpeak() {
  try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch (e) {}
  if (gAudio) { try { gAudio.pause(); } catch (e) {} }
}
/* Google TTS 在线源：系统语音只有一个 / 听不清时切过来。需要联网，但发音更清晰自然。
   audio 无跨域限制，直接播放即可；慢速用 playbackRate 实现。 */
let gAudio = null, gWarned = false;
function speakGoogle(text, rate, cb) {
  stopSpeak();
  try {
    gAudio = new Audio();
    gAudio.src = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q='
      + encodeURIComponent(text) + '&_=' + Date.now();
    gAudio.playbackRate = Math.max(.25, rate || 1);
    let done = false;
    const finish = () => { if (!done) { done = true; cb && cb(); } };
    gAudio.onended = finish;
    gAudio.onerror = () => { finish(); if (!gWarned) { gWarned = true; toast('谷歌语音加载失败，请检查网络'); } };
    gAudio.play().catch(() => { finish(); if (!gWarned) { gWarned = true; toast('谷歌语音加载失败，请检查网络'); } });
  } catch (e) { cb && cb(); }
}
/* 真正发声。Chrome/Safari 偶尔会卡在 speaking=true 却不出声，这里做超时自检并重试一次 */
function speakNow(text, rate, onend, attempt) {
  if (!window.speechSynthesis) { onend && onend(); return; }
  attempt = attempt || 0;
  let started = false, done = false, abandoned = false;
  // abandoned：这一条已被自检放弃，随后 cancel() 触发的 onend/onerror 一律忽略
  const finish = () => { if (!done && !abandoned) { done = true; onend && onend(); } };
  try {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'de-DE';
    u.rate = rate ?? S.set.rate; u.pitch = 1;
    u.onstart = () => started = true;
    u.onend = finish; u.onerror = finish;
    try { speechSynthesis.resume(); } catch (e) {}   // 解掉 Chrome 的暂停态
    speechSynthesis.speak(u);
  } catch (e) { finish(); return; }
  setTimeout(() => {
    if (started || done) return;
    abandoned = true;
    stopSpeak();
    if (attempt < 1) { speakNow(text, rate, onend, attempt + 1); return; }   // 重试一次
    if (!ttsWarned) { ttsWarned = true; toast('这个浏览器没能发声，换 Safari / Chrome 打开试试'); }
    onend && onend();                                                        // 放弃，把控制权交回
  }, 450);
}
function say(text, rate, cb) {
  if (S.set.tts === 'g') { speakGoogle(text, rate, cb); return; }
  stopSpeak(); speakNow(text, rate, cb);
}

/* 依次朗读一串内容，可带高亮回调 */
function sayList(items, i) {
  i = i || 0;
  if (i >= items.length) return;
  const it = items[i];
  if (i === 0) stopSpeak();
  it.on && it.on();
  speakNow(it.text, it.rate, () => {
    it.off && it.off();
    setTimeout(() => sayList(items, i + 1), it.gap ?? 180);
  });
}

/* IPA → 便于 TTS 读出的拟音串（让单个音节也能读准） */
const MAP = [
  ['aɪə','ire'],['aʊə','ower'],['tʃ','ch'],['dʒ','j'],['iː','ee'],['ɑː','ah'],['ɔː','aw'],['uː','oo'],
  ['ɜː','ur'],['ɪə','eer'],['eə','air'],['ʊə','oor'],['eɪ','ay'],['aɪ','igh'],['ɔɪ','oy'],['aʊ','ow'],
  ['əʊ','oh'],['ɛ','eh'],['æ','a'],['ɒ','o'],['ʌ','uh'],['ə','uh'],['ɪ','ih'],['ʊ','oo'],
  ['θ','th'],['ð','th'],['ʃ','sh'],['ʒ','zh'],['ŋ','ng'],['j','y'],['ɡ','g'],['ː',''],
  ['e','eh'],['i','ee'],['u','oo']
];
function respell(ipa) {
  let s = ipa.replace(/[ˈˌ\/·]/g, ''), out = '';
  outer: while (s.length) {
    for (const [a, b] of MAP) { if (s.startsWith(a)) { out += b; s = s.slice(a.length); continue outer; } }
    out += s[0]; s = s.slice(1);
  }
  if (out === 'igh') out = 'eye';
  if (!/[aeiouy]/.test(out) && out.length) {                 // 无元音的音节（如 ʃn）补一个模糊元音
    out = out.length > 1 ? out.slice(0, -1) + 'u' + out.slice(-1) : out + 'uh';
  }
  return out;
}
const sylText = sy => S.set.sylMode === 'respell' ? respell(sy.p) : sy.t;

  h += step('① 顺着读 · 德→中');
  h += `<div class="flow">` + t.flow.map(([de, zh, r]) =>
    `<div class="fl"><span class="fe">${esc(de)}</span><span class="fz ${r || 'x'}">${esc(zh)}</span></div>`).join('') + `</div>`;
  let n = 2;
  if (t.klammer) {
    const [pre, left, mid, right, type] = t.klammer;
    h += step(`${n++} Satzklammer 句框 · ${KLA_TXT[type] || type}`);
    h += `<div class="klamp"><span class="pre">${esc(pre)}</span><span class="mid">${esc(left)}</span>
      <span class="mid">${esc(mid)}</span><span class="right">${esc(right)}</span>
      <span class="kcap">变位动词「${esc(left)}」占第二位，动词第二部分「${esc(right)}」被挤到句末——中间夹住的就是句框。</span></div>`;
  }
  if (t.kasus) {
    h += step(`${n++} 格标注`);
    h += `<div class="kasus">` + t.kasus.map(([de, k]) =>
      `<span><em>${esc(de)}</em><i>${esc(k)}</i></span>`).join('') + `</div>`;
  }
  h += step(`${n++} 完整译文`);
  h += `<div class="tr-final">` + (t.final
    ? t.final.map(([z, r]) => `<span class="fw ${r || 'x'}">${esc(z)}</span>`).join('')
    : esc(t.zh)) + `</div>`;
  h += `<div class="tr-tip">${esc(t.tip)}</div></div>`;
  return h;
}

/* 卡片交互：按钮 / 音节 / 翻面 */
$('card3d').addEventListener('click', e => {
  const w = Q[qi];

    return;
  }

    e.stopPropagation();
    say(sb.dataset.say, sb.dataset.slow ? SLOW : undefined);
    return;
  }
  const cut = e.target.closest('.cut');
  if (cut) {
    e.stopPropagation();
    say(cut.dataset.t, SLOW);
    return;
  }
  const sy = e.target.closest('.syl');
  if (sy) {
    e.stopPropagation();

/* 逐音节跟读：一个个音节 → 整词慢速 → 整词正常 */
function playSeq(w) {
  const chips = [...document.querySelectorAll('#syls .syl')];
  const items = flatSyl(w).map((sy, i) => ({
    text: sylText(sy), rate: SLOW, gap: 240,
    on: () => chips[i]?.classList.add('hi'), off: () => chips[i]?.classList.remove('hi')
  }));
  items.push({ text: w.w, rate: SLOW, gap: 300 }, { text: w.w, rate: S.set.rate });
  sayList(items);
}

/* 德语数字 0-199 生成器（PRODUCT.md 5.1：数字倒读是听力最大失分点） */
const NUM0 = ['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf'];
const NUM10 = ['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const NUM_EINZ = ['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
const NUM_ZEHN = ['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
function numDe(n) {
  if (n < 12) return NUM0[n];
  if (n < 20) return NUM10[n - 10];
  if (n < 100) return (n % 10 ? NUM_EINZ[n % 10] + 'und' : '') + NUM_ZEHN[(n / 10) | 0];
  return 'hundert' + (n % 100 ? numDe(n % 100) : '');
}
/* 时间表达：halb X = 下一个整点的一半；Viertel nach/vor 同逻辑 */
function zeitDe(h, m) {
  const hh = h % 12 || 12;
  if (m === 0) return 'Es ist ' + numDe(h) + ' Uhr.';
  if (m === 15) return 'Es ist Viertel nach ' + numDe(h) + '.';
  if (m === 30) return 'Es ist halb ' + numDe(hh) + '.';
  if (m === 45) return 'Es ist Viertel vor ' + numDe(hh) + '.';
  if (m < 30) return 'Es ist ' + numDe(h) + ' Uhr ' + numDe(m) + '.';
  return 'Es ist ' + numDe(hh) + ' Uhr minus ' + numDe(60 - m) + '.';
}
const zz = n => (n < 10 ? '0' : '') + n;
/* 性别词尾规律（PRODUCT.md 4.1）：约 80% 可预测，错的时候提示学生看词尾 */
const ENDREGELN = [
  ['ung','die'],['heit','die'],['keit','die'],['schaft','die'],['ion','die'],['tät','die'],['ik','die'],['ur','die'],
  ['er','der'],['ling','der'],['ismus','der'],['ig','der'],
  ['chen','das'],['lein','das'],['ment','das'],['tum','das'],
];
function endregel(w) {
  for (const [s, a] of ENDREGELN) if (w.toLowerCase().endsWith(s)) return [s, a];
  return null;
}

      say(numDe(cur));
      $('again').onclick = () => say(numDe(cur));
      $('numIn').focus();
      $('chk').onclick = () => judge(+($('numIn').value.trim()));
      $('numIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('chk').click(); });
      $('skip').onclick = () => { total++; showAns(null); };
    } else {
      q.innerHTML = `<div class="qbig">${cur}</div>
        <div class="qsub">写出德语（如 21 → einundzwanzig）</div>
        <input class="qinp" id="numIn" placeholder="德语拼写…">
        <div class="qbtn"><button class="btn pri" id="chk">判分</button><button class="btn line" id="skip">看答案</button></div>`;
      $('chk').onclick = () => judgeTyped($('numIn').value);
      $('numIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('chk').click(); });
      $('skip').onclick = () => { total++; showAns(null); };
    }
  }
  function showAns(good) {
    const fb = $('qfb');
    fb.style.display = 'block';
    if (good === true) { fb.className = 'qfb ok'; fb.innerHTML = `✔ <b>${numDe(cur)}</b> = ${cur}`; right++; }
    else if (good === false) { fb.className = 'qfb no'; fb.innerHTML = `✘ 正确答案是 <b>${numDe(cur)}</b> = ${cur}，记住倒读：个位 + und + 十位`; }
    else { fb.className = 'qfb no'; fb.innerHTML = `<b>${numDe(cur)}</b> = ${cur}`; }
    drLater(next, 1500);
  }
  function judge(v) {
    if (v === cur) { total++; showAns(true); }
    else { total++; showAns(false); }
  }
  function judgeTyped(v) {
    const s = v.trim().toLowerCase().replace(/[\s-]+/g, '');
    total++;
    if (s === numDe(cur).replace(/[\s-]+/g, '')) showAns(true);
    else showAns(false);
  }
  draw();
};

        <div class="qbig" style="font-size:var(--font-size-xl);margin-top:12px">${esc(sentence)}</div>
      </div>`}
      <div class="sec-t" style="margin-top:14px">${type !== 'satz' ? '排出这个句框' : '排出语序'}</div>
      <div class="sel" id="sel"></div>
      <div class="pool" id="pool"></div>
      <div class="satz-act">
        <button class="btn line" id="undo">退一步</button>
        <button class="btn pri" id="chkS">检查</button>
        <button class="btn line" id="skipS">看答案</button>
      </div>
      <div class="qfb" id="qfb" style="display:none"></div>
      <div class="drstat" id="qstat"></div>`;
    const pool = $('pool'), sel = $('sel');
    const selArr = [];
    pool.innerHTML = q.map((b, k) => `<button class="block" data-k="${k}">${esc(b)}</button>`).join('');
    const paint = () => {
      [...pool.children].forEach(x => x.classList.toggle('dim', selArr.includes(+x.dataset.k)));
      sel.innerHTML = selArr.map(k => `<button class="block" data-k="${k}">${esc(q[k])}</button>`).join('');
    };
    pool.onclick = e => {
      const b = e.target.closest('.block'); if (!b || done) return;
      const k = +b.dataset.k;
      if (selArr.includes(k)) return;
      selArr.push(k); paint();
      if (selArr.length === q.length) drLater(() => $('chkS').click(), 150);
    };
    sel.onclick = e => {
      const b = e.target.closest('.block'); if (!b) return;
      selArr.splice(selArr.indexOf(+b.dataset.k), 1); paint();
    };
    const judge = ok => {
      const fb = $('qfb'); done = true;
      if (ok) right++;
      fb.style.display = 'block';
      fb.className = 'qfb ' + (ok ? 'ok' : 'no');
      if (ok) fb.innerHTML = `✔ 语序正确`;
      else fb.innerHTML = `✘ 正确语序：<b>${esc(ans)}</b>${type !== 'satz' ? '　（框：' + esc(KLA_LB[type]) + '）' : ''}`;
      $('qstat').textContent = `对 ${right} / ${total}`;
      drLater(() => { i++; if (i >= SATZU.length) { i = 0; right = total = 0; } draw(); }, 2000);    };
    $('chkS').onclick = () => judge(selArr.map(k => q[k]).join(' ') === ans);
    $('skipS').onclick = () => { judge(false); };
    $('undo').onclick = () => { if (selArr.length) { selArr.pop(); paint(); } };
    /* 讲解区的句框示意（静态图） */
    const kd = $('kDemo');
    if (type === 'modal') kd.innerHTML = `<span class="pre">Ich</span><span class="mid">muss</span><span class="mid">morgen früh</span><span class="right">aufstehen</span><span class="kcap" style="flex-basis:100%">Ich muss morgen früh aufstehen. —— 变位动词 muss + 句末 Infinitiv</span>`;
    else if (type === 'trennbar') kd.innerHTML = `<span class="pre">Ich</span><span class="mid">stehe</span><span class="mid">um sieben Uhr</span><span class="right">auf</span><span class="kcap" style="flex-basis:100%">Ich stehe um sieben Uhr auf. —— 前缀 auf 被挤到句末</span>`;
    else if (type === 'perfekt') kd.innerHTML = `<span class="pre">Ich</span><span class="mid">habe</span><span class="mid">schon</span><span class="right">gegessen</span><span class="kcap" style="flex-basis:100%">Ich habe schon gegessen. —— haben + 句末 Partizip</span>`;
    else kd.innerHTML = `<span class="mid" style="border-bottom:none;border-top:none">V2：陈述句里变位动词永远第二位。先锁定动词，前后自然排开。</span>`;
    const st = $('qstat'); st.textContent = `第 ${i + 1} 题`;
    const fb = $('qfb'); fb.style.display = 'none';
  };
  body.innerHTML = `<div class="dseg"><button class="on">排语序 · 共 ${SATZU.length} 题</button></div>`;
  draw();
};

  const el = $('toast'); el.textContent = m; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1600);
}
document.addEventListener('keydown', e => {
