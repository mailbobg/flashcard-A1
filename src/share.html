<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
__FONTS__
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{
  background:#F8F4ED;color:#15110C;
  font-family:Figtree,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(70% 46% at 6% 100%, rgba(242,121,2,.20), transparent 70%),
    radial-gradient(64% 44% at 94% 100%, rgba(230,56,179,.18), transparent 72%),
    radial-gradient(90% 32% at 50% 100%, rgba(226,164,0,.13), transparent 70%);
}
.wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;gap:64px;padding:0 76px}
.copy{flex:1;min-width:0}
.mark{width:76px;height:76px;margin-bottom:26px}
.mark svg{width:100%;height:100%;display:block}
h1{font-size:64px;font-weight:600;letter-spacing:-.035em;line-height:1.05}
.sub{font-size:26px;color:#4E606F;margin-top:20px;line-height:1.5;font-weight:500}
.pills{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.pills span{
  border:1.5px solid #CCD3DB;border-radius:999px;padding:9px 18px;
  font-size:19px;color:#15110C;font-weight:500;
}
/* 标本砖，和卡片正面同构 */
.demo{
  flex:0 0 auto;background:#fff;border:1px solid #05365919;border-radius:32px;
  padding:38px 34px;box-shadow:0 2px 2px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.10);
}
.word{font-size:46px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.art{
  display:inline-block;font-size:.62em;font-weight:700;vertical-align:.14em;
  padding:2px 12px;border-radius:999px;letter-spacing:.02em;
}
.art.der{background:#EAF0FF;color:#1A46C4}
.art.die{background:#FDE9EB;color:#B3122A}
.art.das{background:#E4F5E8;color:#0B6C1E}
.plural{
  display:table;margin-top:16px;font-size:30px;font-weight:500;
  background:#FDE9EB;color:#B3122A;padding:4px 16px;border-radius:999px;
}
.zh{font-size:30px;color:#15110C;margin-top:20px;font-weight:500}
.arts{display:flex;align-items:center;gap:8px;margin-top:30px;
  padding-top:22px;border-top:1px solid #05365919}
.arts .art{font-size:17px;padding:3px 11px;vertical-align:0}
.arts em{font-style:normal;font-size:17px;color:#4E606F;margin-left:6px}
.bricks{display:flex;gap:10px;margin-top:26px}
.b{
  position:relative;border:1px solid #CCD3DB;border-radius:14px;
  padding:22px 15px 12px;min-width:82px;text-align:center;
}
.b .ix{position:absolute;top:7px;left:10px;font-size:12px;color:#A4B0BC}
.b .oc{position:absolute;top:7px;right:10px;font-size:12px;color:#A4B0BC}
.b .sp{font-size:28px;font-weight:600}
.b .pp{font-size:16px;color:#4E606F;margin-top:5px}
.v{color:#D31130}
.c{color:#225BFF}

/* 方形（微信缩略图）：改为上下堆叠 */
@media (max-aspect-ratio:1/1){
  .wrap{flex-direction:column;justify-content:center;gap:44px;padding:0 56px;text-align:left}
  .copy{flex:0 0 auto;width:100%}
  .mark{width:64px;height:64px;margin-bottom:22px}
  h1{font-size:58px}
  .sub{font-size:23px;margin-top:16px}
  .pills{display:none}
  .demo{width:100%;padding:32px 28px;border-radius:28px}
  .word{font-size:40px}
  .plural{font-size:26px;margin-top:13px}
  .zh{font-size:26px;margin-top:16px}
  .arts{margin-top:24px;padding-top:18px}
}
</style></head><body>
<div class="wrap">
  <div class="copy">
    <div class="mark">__LOGO__</div>
    <h1>德语 A1<br>歌德证书备考</h1>
    <div class="sub">官方词表 __N__ 词 · der/die/das 三色<br>零基础发音关 · 德语朗读</div>
    <div class="pills"><span>官方词表</span><span>性别三色</span><span>间隔重复</span><span>离线可用</span></div>
  </div>
  <div class="demo">
    <div class="word"><span class="art der">der</span> Apfel</div>
    <div class="plural">die Äpfel</div>
    <div class="zh">苹果</div>
    <div class="arts">
      <span class="art der">der</span><span class="art die">die</span><span class="art das">das</span>
      <em>冠词的颜色就是性别</em>
    </div>
  </div>
</div>
</body></html>
